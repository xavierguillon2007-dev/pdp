<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Pen-Seurs de Plaies</title><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="styles.css"></head>
<body class="admin-body">
<aside class="admin-sidebar"><a class="brand admin-brand" href="index.html"><img src="assets/logo.png"><div><strong>Pen-Seurs de Plaies</strong><small>Administration</small></div></a>
<a class="side-link active" href="admin.html">⌂ Tableau de bord</a><a class="side-link" href="#articles">▤ Articles</a><a class="side-link" href="#editor">✎ Nouvel article</a><a class="side-link" href="#categories">◫ Catégories</a><a class="side-link" href="#media">▣ Médias</a><a class="side-link" href="#" id="logout">↪ Déconnexion</a></aside>
<main class="admin-main"><div class="admin-top"><div><span class="eyebrow">Administration</span><h1>Tableau de bord</h1></div><a class="btn btn-dark" href="#editor">+ Nouvel article</a></div>
<div id="adminMessage" class="form-msg"></div>
<section class="stats"><div class="stat"><span>Articles publiés</span><b id="statPublished">—</b></div><div class="stat"><span>Brouillons</span><b id="statDrafts">—</b></div><div class="stat"><span>Catégories</span><b id="statCategories">—</b></div></section>
<section class="admin-card" id="articles"><div class="card-heading"><h2>Articles</h2><button class="btn btn-dark" onclick="Journal.newArticle()">+ Nouvel article</button></div><div class="table-wrap"><table><thead><tr><th>Titre</th><th>Catégorie</th><th>Statut</th><th>Date</th><th>Actions</th></tr></thead><tbody id="adminArticles"></tbody></table></div></section>
<section class="admin-card" id="editor"><div class="card-heading"><h2 id="editorTitle">Nouvel article</h2><button class="btn btn-outline" onclick="Journal.clearEditor()">Annuler</button></div>
<form id="articleForm" class="editor-grid"><input type="hidden" id="articleId">
<div class="editor-main"><label>Titre<input id="title" required placeholder="Le titre de votre article"></label><label>Extrait<textarea id="excerpt" rows="3" placeholder="Un court résumé…"></textarea></label>
<label>Contenu <span class="muted">(HTML simple autorisé)</span><textarea id="content" rows="16" required placeholder="<p>Rédigez votre article ici…</p>"></textarea></label>
<label>Vidéo YouTube <span class="muted">(facultatif)</span><input id="youtube" placeholder="https://www.youtube.com/watch?v=..."></label>
<div class="upload-box"><b>Image de couverture</b><input id="cover" type="file" accept="image/*"><div id="coverPreview"></div></div></div>
<aside class="editor-side"><label>Catégorie<select id="categoryEdit"></select></label><label>Statut<select id="status"><option value="draft">Brouillon</option><option value="published">Publié</option></select></label><label>Date de publication<input id="publishedAt" type="datetime-local"></label><button class="btn btn-dark full" type="submit">Enregistrer</button></aside></form></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>Journal.admin());</script>
</body></html>
